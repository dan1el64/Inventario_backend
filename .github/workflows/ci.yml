name: Backend CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew test bootJar --no-daemon
      - name: Validate local composition
        run: DB_PASSWORD=ci-local-synthetic-value docker compose config --quiet
      - name: Build runnable container
        run: docker build -t inventory-api:ci .
      - name: Check PostgreSQL profile and HTTP API
        env:
          DB_PASSWORD: ci-local-synthetic-value
        run: |
          docker compose up -d db app
          trap 'docker compose logs; docker compose down -v' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/v1/products
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: build/reports/tests/test
