name: Backend CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew test bootJar --no-daemon
      - name: Validate local composition
        run: DB_PASSWORD=ci-local-synthetic-value docker compose config --quiet
      - name: Run complete PostgreSQL API and Angular demo
        env:
          DB_PASSWORD: ci-local-synthetic-value
        run: |
          trap 'docker compose --profile demo logs; docker compose --profile demo down -v' EXIT
          ./scripts/demo.sh
          curl -fsS http://localhost:8080/actuator/health
          curl -fsS http://localhost:4200/ | grep -q '<app-root'
          curl -fsS http://localhost:4200/api/v1/products | grep -q '"success":true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: build/reports/tests/test
